<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="LuKi Anime Coder midnight banner with original cat programmer mascot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090E21"/><stop offset="0.52" stop-color="#171634"/><stop offset="1" stop-color="#0A1B34"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#D8EFFF"/><stop offset=".55" stop-color="#91CFFF"/><stop offset="1" stop-color="#DBA7FF"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A5D4FF"/><stop offset="1" stop-color="#CA9FFD"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8C7AE5"/><stop offset="1" stop-color="#45457C"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3C3F85"/><stop offset=".6" stop-color="#28295A"/><stop offset="1" stop-color="#1D244B"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#25254D"/><stop offset="1" stop-color="#151B39"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop stop-color="#AA97FF" stop-opacity=".25"/><stop offset="1" stop-color="#AA97FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="430" rx="28"/></clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .twinkle{animation:twinkle 4s ease-in-out infinite;transform-origin:center}
      .twinkle.s2{animation-delay:1.5s}.twinkle.s3{animation-delay:2.6s}
      .float{animation:bob 5.5s ease-in-out infinite}
      @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @media(prefers-reduced-motion:reduce){.twinkle,.float{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="430" fill="url(#bg)"/>
    <path d="M0 372 Q230 290 440 360 T850 338 T1280 330 L1280 430 H0Z" fill="#121B3A" opacity=".66"/>
    <path d="M0 407 Q280 350 510 420 T1020 390 T1280 401" stroke="#AF9BFF" stroke-width="2" fill="none" opacity=".12"/>
    <g stroke="#9DABFF" opacity=".065" stroke-width="1">
      <path d="M0 80H1280 M0 160H1280 M0 240H1280 M0 320H1280 M90 0V430 M190 0V430 M290 0V430 M390 0V430 M490 0V430 M590 0V430 M690 0V430 M790 0V430 M890 0V430 M990 0V430 M1090 0V430 M1190 0V430"/>
    </g>
    <circle cx="1020" cy="205" r="250" fill="url(#halo)"/>
    <circle cx="1158" cy="93" r="41" fill="#D9D9FE" opacity=".78"/>
    <circle cx="1176" cy="80" r="40" fill="#151A37"/>
    <g fill="#BCA7FA">
